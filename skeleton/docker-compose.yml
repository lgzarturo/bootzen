# Producción con Docker: docker compose up -d --build
# Pasa al contenedor todo lo que tengas en .env (correo incluido) y fuerza lo de producción de abajo.
# La guía completa está en docs/deploy/docker.md

# Lo que comparten la web y el scheduler: misma imagen, mismas variables y mismos datos
x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &environment
    APP_NAME: ${APP_NAME:-BootZen}
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_KEY: ${APP_KEY:?Define APP_KEY en .env (php bin/bootzen key:generate)}
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    # El proxy que pongas delante (HTTPS) llega por la red de Docker: se confía en sus cabeceras
    # X-Forwarded-*. Si publicas el puerto directo a internet, déjalo vacío en .env
    TRUSTED_PROXIES: ${TRUSTED_PROXIES-private}
    DB_CONNECTION: sqlite
    DB_DATABASE: storage/database/app.sqlite
  volumes:
    # Base SQLite, sesiones, logs, archivos privados y respaldos
    - storage:/var/www/html/storage
    # Archivos subidos con storePublic()
    - uploads:/var/www/html/public/uploads

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:80"

  # Ejecuta routes/schedule.php cada minuto (y con él la cola, si la programas ahí)
  scheduler:
    <<: *app
    environment:
      <<: *environment
      MIGRATE_ON_START: "false"
    command: ["bootzen-scheduler"]
    healthcheck:
      disable: true
    depends_on:
      - app

volumes:
  storage:
  uploads:
