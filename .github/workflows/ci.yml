name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  framework:
    name: Framework (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none

      - name: Instalar dependencias de desarrollo
        run: composer install --no-interaction --no-progress

      - name: Formato, PHPStan y tests
        run: composer check

  coverage:
    name: Cobertura (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: pcov

      - name: Instalar dependencias de desarrollo
        run: composer install --no-interaction --no-progress

      # Falla si la cobertura total baja de 80%. Meta en piezas críticas
      # (Container, Router, Request, Response): 90%, se revisa en cada PR
      - name: Cobertura mínima 80%
        run: vendor/bin/pest --coverage --min=80

  skeleton:
    name: Proyecto generado (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none

      - name: Crear proyecto con bin/bootzen-new
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          cd "$RUNNER_TEMP/apps"
          php "$GITHUB_WORKSPACE/bin/bootzen-new" demo --no-git

      - name: Responde sin Composer en runtime
        working-directory: ${{ runner.temp }}/apps/demo
        run: |
          test ! -d vendor
          php -S 127.0.0.1:8000 -t public > /dev/null 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8000/ | grep -q "Hola"
          curl -fsS http://127.0.0.1:8000/up | grep -q '"ok"'

      - name: make:resource genera un CRUD que pasa composer check sin tocar nada
        working-directory: ${{ runner.temp }}/apps/demo
        run: |
          php bin/bootzen make:resource Task title:string done:bool
          composer install --no-interaction --no-progress
          composer check
          php bin/bootzen check

      - name: Migraciones, rutas y doctor del proyecto generado
        working-directory: ${{ runner.temp }}/apps/demo
        run: |
          php bin/bootzen migrate
          php bin/bootzen route:list | grep -q 'tasks.index'
          php bin/bootzen doctor

      - name: Crear la app de demostración (--demo, incluye --auth)
        run: |
          cd "$RUNNER_TEMP/apps"
          php "$GITHUB_WORKSPACE/bin/bootzen-new" demo-auth --demo --no-git

      - name: composer check de la app de demostración
        working-directory: ${{ runner.temp }}/apps/demo-auth
        run: |
          composer install --no-interaction --no-progress
          composer check

      - name: Registro, inicio de sesión y tareas por HTTP con sesiones en archivos
        working-directory: ${{ runner.temp }}/apps/demo-auth
        run: |
          php bin/bootzen migrate
          php -S 127.0.0.1:8001 -t public > /dev/null 2>&1 &
          sleep 1
          token=$(curl -fsS -c jar -b jar http://127.0.0.1:8001/registro | grep -o 'name="_token" value="[a-f0-9]*"' | head -1 | sed 's/.*value="//;s/"//')
          test -n "$token"
          # Sin token CSRF la respuesta es 419
          test "$(curl -sS -o /dev/null -w '%{http_code}' -c jar -b jar -d 'nombre=Ana' http://127.0.0.1:8001/registro)" = "419"
          curl -fsS -o /dev/null -w '%{redirect_url}' -c jar -b jar --data-urlencode "_token=$token" \
            -d 'nombre=Ana&email=ana@ejemplo.com&password=secreto-largo&password_confirmation=secreto-largo' \
            http://127.0.0.1:8001/registro | grep -q '/tareas'
          curl -fsS -c jar -b jar http://127.0.0.1:8001/panel | grep -q 'Hola, Ana'
          curl -fsS -c jar -b jar -H 'Accept: application/json' http://127.0.0.1:8001/tareas | grep -q '"total":0'
          # El seeder de la demo reutiliza a Ana y le crea tres tareas
          php bin/bootzen db:seed
          curl -fsS -c jar -b jar -H 'Accept: application/json' http://127.0.0.1:8001/tareas | grep -q '"total":3'

      - name: Tailwind standalone y CSS del skeleton al día
        working-directory: ${{ runner.temp }}/apps/demo-auth
        run: |
          php bin/bootzen css:build
          # El CSS versionado en skeleton/ se genera desde la app --demo, así cubre también las vistas de auth y de la demo
          cmp public/assets/app.css "$GITHUB_WORKSPACE/skeleton/public/assets/app.css" || {
            echo "skeleton/public/assets/app.css está desactualizado: regenéralo con php bin/bootzen css:build en un proyecto creado con --demo";
            exit 1;
          }
          php bin/bootzen view:cache

  mysql:
    name: MySQL 8.4 (PHP 8.3)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: bootzen_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, fileinfo, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Instalar dependencias de desarrollo
        run: composer install --no-interaction --no-progress

      - name: Tests de integración con MySQL
        env:
          BOOTZEN_TEST_MYSQL_HOST: 127.0.0.1
          BOOTZEN_TEST_MYSQL_PORT: "3306"
          BOOTZEN_TEST_MYSQL_DATABASE: bootzen_test
          BOOTZEN_TEST_MYSQL_USERNAME: root
          BOOTZEN_TEST_MYSQL_PASSWORD: secret
        run: |
          vendor/bin/pest tests/Feature/MySqlTest.php --colors=never | tee "$RUNNER_TEMP/mysql.txt"
          # Si los tests se saltaran por falta de configuración, el job no debe pasar en verde
          grep -q "4 passed" "$RUNNER_TEMP/mysql.txt"

  js:
    name: Runtime JS (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests de bootzen.js
        run: |
          npm ci --no-audit --no-fund
          npm run test:js
