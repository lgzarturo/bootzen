; Pool de PHP-FPM para la app. Corre como el usuario que despliega (deploy), así PHP y
; bin/bootzen escriben los mismos archivos (base SQLite, sesiones, logs) sin pelear por permisos.
; Copia a /etc/php/8.3/fpm/pool.d/tienda.conf, cambia nombre y usuario, y recarga php8.3-fpm.
; Guía: docs/deploy/vps.md

[tienda]
user = deploy
group = deploy

; Nginx corre como www-data. Con Caddy usa listen.owner = caddy y listen.group = caddy
listen = /run/php/tienda.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s

php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[memory_limit] = 256M
