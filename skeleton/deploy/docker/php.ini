; Ajustes de producción para la imagen de Docker
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M

; El código no cambia dentro del contenedor: OPcache no necesita revisar fechas
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
