# Nginx + PHP-FPM en un VPS. Copia a /etc/nginx/sites-available/tienda, cambia el dominio,
# la ruta y el socket del pool (deploy/php-fpm.conf), y actívalo. Guía: docs/deploy/vps.md
# HTTPS: sudo certbot --nginx -d tienda.example.com (agrega el bloque 443 por ti)

server {
    listen 80;
    listen [::]:80;
    server_name tienda.example.com;

    # current/ apunta a la última versión publicada por deploy/deploy.sh
    root /var/www/tienda/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # CSS, JS e imágenes llevan ?v=<fecha> desde asset(): se pueden cachear mucho tiempo
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Solo index.php se ejecuta; cualquier otro .php (por ejemplo en uploads/) da 404
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/tienda.sock;
        # $realpath_root resuelve el enlace current/ para que cada versión use su propio código
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
